[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcall-lora"
version = "0.1.0"
description = "Reproducible Qwen tool-calling LoRA experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.6.0", "transformers==4.51.3", "peft==0.15.2", "accelerate==1.6.0", "datasets==3.5.0", "pyarrow==19.0.1", "numpy==1.26.4"]
data = ["huggingface-hub==0.30.2"]
bfcl = ["bfcl-eval==2026.3.23", "soundfile==0.13.1"]
vllm = ["vllm==0.8.5.post1"]

[project.scripts]
toolcall-lora = "toolcall_lora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
